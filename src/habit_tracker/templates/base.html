<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root { --pico-font-size: 16px; }
        .container { max-width: 600px; padding: 1rem; }
        .date-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .habit-group {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 0.5rem;
        }
        .habit-label { font-weight: 600; margin-bottom: 0.5rem; }
        fieldset { border: none; padding: 0; margin: 0; }
        .options { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
        .options label { display: flex; align-items: center; gap: 0; }
        /* Keyboard entry styles */
        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .keyboard-hint {
            font-size: 0.75rem;
            color: var(--pico-muted-color);
            background: var(--pico-secondary-background);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .option-item label { margin-bottom: 0; }
        .option-item input { margin-bottom: 0; }
        .option-number {
            font-size: 0.7rem;
            color: var(--pico-muted-color);
            background: var(--pico-secondary-background);
            width: 1.25rem;
            height: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
            font-family: monospace;
        }
        .habit-group:focus {
            border-color: var(--pico-primary);
            outline: none;
        }
        .habit-group:focus-within {
            border-color: var(--pico-primary);
        }
        /* Hide keyboard hints on mobile */
        @media (max-width: 600px) {
            .keyboard-hint { display: none; }
            .option-number { display: none; }
        }
        @media (max-width: 600px) {
            .options { flex-direction: column; }
            button[type="submit"] { width: 100%; padding: 1rem; font-size: 1.2rem; }
        }
        .saved-indicator {
            color: green;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .saved-indicator.show { opacity: 1; }

        /* Habit management styles */
        .habit-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .habit-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 0.25rem;
            margin-bottom: 0.5rem;
        }
        .habit-list-item.archived {
            opacity: 0.6;
        }
        .habit-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .habit-type-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            background: var(--pico-secondary-background);
        }
        .habit-id {
            color: var(--pico-muted-color);
        }
        .archived-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            background: #fef3c7;
            color: #92400e;
        }
        .habit-actions {
            display: flex;
            gap: 0.5rem;
        }
        .habit-actions button {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            margin: 0;
        }
        .no-habits {
            color: var(--pico-muted-color);
            text-align: center;
            padding: 1rem;
            list-style: none;
        }
    </style>
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>

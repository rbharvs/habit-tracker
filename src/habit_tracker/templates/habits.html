{% extends "base.html" %}

{% block content %}
<header class="date-nav">
    <a href="./">&larr; Daily Entry</a>
    <a href="./calendar">Calendar View</a>
</header>

<h2>Manage Habits</h2>

<section id="habit-list">
    {% include "partials/habit_list.html" %}
</section>

<hr>

<h3>Add New Habit</h3>
<form method="post" action="habits" hx-post="habits" hx-target="#habit-list" hx-swap="innerHTML" autocomplete="off">
    <label>
        ID (unique, no spaces)
        <input type="text" name="id" required pattern="[a-z0-9_-]+"
               placeholder="e.g., morning_workout" data-1p-ignore>
    </label>

    <label>
        Name
        <input type="text" name="name" required placeholder="e.g., Did you work out?" data-1p-ignore>
    </label>

    <label>
        Type
        <select name="type" id="habit-type" onchange="toggleOptions()">
            <option value="binary">Binary (Yes/No)</option>
            <option value="single_select">Single Select</option>
            <option value="multi_select">Multi Select</option>
            <option value="numeric">Numeric</option>
            <option value="time">Time</option>
            <option value="journal">Journal</option>
        </select>
    </label>

    <div id="options-field" style="display: none;">
        <label>
            Options (comma-separated, max 9)
            <input type="text" name="options" placeholder="e.g., great, good, okay, bad" data-1p-ignore>
        </label>
    </div>

    <div id="unit-field" style="display: none;">
        <label>
            Unit (optional)
            <input type="text" name="unit" placeholder="e.g., glasses, pages" data-1p-ignore>
        </label>
    </div>

    <button type="submit">Create Habit</button>
</form>

<script>
function toggleOptions() {
    const type = document.getElementById('habit-type').value;
    const optionsField = document.getElementById('options-field');
    const unitField = document.getElementById('unit-field');

    optionsField.style.display = ['single_select', 'multi_select'].includes(type) ? 'block' : 'none';
    unitField.style.display = type === 'numeric' ? 'block' : 'none';
}

// Hard delete with confirmation
async function confirmHardDelete(habitId, habitName) {
    const response = await fetch(`habits/${habitId}/entry-count`);
    const data = await response.json();
    const count = data.count;

    const message = count > 0
        ? `Permanently delete "${habitName}"? This will also delete ${count} entries. This cannot be undone!`
        : `Permanently delete "${habitName}"? This cannot be undone!`;

    if (confirm(message)) {
        htmx.ajax('DELETE', `habits/${habitId}?hard=true`, {target: '#habit-list', swap: 'innerHTML'});
    }
}

// Initialize SortableJS for drag-and-drop reordering
function initSortable() {
    const list = document.getElementById('sortable-habits');
    if (!list || typeof Sortable === 'undefined') return;

    // Destroy existing instance if any
    if (list.sortableInstance) {
        list.sortableInstance.destroy();
    }

    list.sortableInstance = Sortable.create(list, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'habit-ghost',
        dragClass: 'habit-dragging',
        filter: '.archived',
        delay: 150,
        delayOnTouchOnly: true,
        touchStartThreshold: 5,
        onEnd: function(evt) {
            // Collect new order of habit IDs (only non-archived)
            const items = list.querySelectorAll('.habit-list-item:not(.archived)');
            const order = Array.from(items).map(item => item.dataset.id);

            // Send to server
            fetch('habits/reorder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'HX-Request': 'true'
                },
                body: JSON.stringify(order)
            }).then(response => response.text())
              .then(html => {
                  document.getElementById('habit-list').innerHTML = html;
                  htmx.process(document.getElementById('habit-list'));
                  initSortable();
              });
        }
    });
}

// Initialize on page load
initSortable();

// Re-initialize after any htmx swap to habit-list
document.body.addEventListener('htmx:afterSwap', (e) => {
    if (e.detail.target.id === 'habit-list') {
        initSortable();
    }
    // Reset form after successful habit creation
    if (e.detail.requestConfig.path === 'habits' && e.detail.requestConfig.verb === 'post') {
        document.querySelector('form').reset();
        toggleOptions();
    }
});
</script>
{% endblock %}

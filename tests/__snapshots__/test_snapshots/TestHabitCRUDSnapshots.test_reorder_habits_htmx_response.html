<ul class="habit-list" id="sortable-habits">

<li class="habit-list-item " data-id="notes">
    <div class="habit-header-row">
        <div class="habit-meta">
            <span class="drag-handle" title="Drag to reorder">⠿</span>
            <span class="habit-type-badge">Journal</span>
            <small class="habit-id">notes</small>
            
        </div>
        <div class="habit-actions">
            
            <a href="habits/notes/edit" role="button" class="outline secondary" title="Edit">
                Edit
            </a>
            <button class="outline secondary"
                    hx-delete="habits/notes"
                    hx-target="#habit-list"
                    hx-swap="innerHTML"
                    hx-confirm="Archive this habit? It will be hidden from daily view but entries will be preserved.">
                Archive
            </button>
            
            <button class="outline secondary delete-btn"
                    data-habit-id="notes"
                    onclick="confirmHardDelete('notes', 'Daily notes')">
                Delete
            </button>
        </div>
    </div>
    <div class="habit-name">Daily notes</div>
</li>

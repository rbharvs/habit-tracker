AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Habit Tracker - FastAPI on Lambda

Parameters:
  AllowedIPs:
    Type: CommaDelimitedList
    Description: IP CIDR ranges to allow (Cloudflare IPs + your IP)
  DomainName:
    Type: String
    Description: Custom domain name (e.g., habits.example.com)
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for custom domain

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  HabitApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Auth:
        ResourcePolicy:
          IpRangeWhitelist: !Ref AllowedIPs

  HabitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: habit-tracker
      Handler: habit_tracker.handler.handler
      CodeUri: src/
      Environment:
        Variables:
          STORAGE_BACKEND: dynamodb
          TABLE_NAME: !Ref HabitTable
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref HabitApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HabitApi
            Path: /{proxy+}
            Method: ANY
        WarmUp:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"source": "warmup"}'
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HabitTable
    Metadata:
      BuildMethod: python3.12

  HabitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: habit-tracker
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  CustomDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref CustomDomain
      RestApiId: !Ref HabitApi
      Stage: Prod
    DependsOn: HabitApiProdStage

Outputs:
  ApiUrl:
    Description: API Gateway URL (direct, for testing)
    Value: !Sub https://${HabitApi}.execute-api.${AWS::Region}.amazonaws.com/Prod

  CustomDomainTarget:
    Description: CNAME target for Cloudflare DNS
    Value: !GetAtt CustomDomain.RegionalDomainName

  FunctionName:
    Description: Lambda function name
    Value: !Ref HabitFunction

  TableName:
    Description: DynamoDB table name
    Value: !Ref HabitTable
